spring.application.name=orderservice-merezh
server.port=8085

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health, info
management.endpoint.health.group.liveness.include=livenessState, ping
management.endpoint.health.group.readiness.include=readinessState, db
management.health.diskspace.enabled=false

spring.datasource.url=jdbc:postgresql://postgres-orderservice:5432/orderservice-merezh
spring.datasource.username=postgres
spring.datasource.password=postgres123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG

service.payments.url=http://paymentservice-merezh:8084/api/v1/payments